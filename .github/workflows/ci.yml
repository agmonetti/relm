name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: vet · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        # Network engine tests are skipped without env vars (see README).
        run: go test ./...

      - name: go build
        run: go build ./...
